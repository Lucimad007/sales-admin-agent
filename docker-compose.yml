services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales_admin
    ports:
      - "55432:5432"
    volumes:
      - sales_admin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sales_admin_pg:
